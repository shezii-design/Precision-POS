<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="theme-color" content="#b91c1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PrecisionPOS" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <title>Inventory | Precision Parts & Automotive POS</title>
    <meta name="description" content="Cross-device offline & cloud inventory management with Staff Management & RBAC Permissions, Executive Business Dashboard, multi-step Income Statement (P&L), POS sales, customer repeat pricing history, printable invoices, customer demand tracking, Purchase Orders with cargo landed cost distribution, comprehensive stock audit logs, customer & vendor ledgers, quotations, and tiered PKR pricing formulas." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Self-healing: Unregister any stale or broken service workers from prior dev runs immediately
      if (typeof window !== 'undefined') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        }
        if (window.caches) {
          caches.keys().then(function(names) {
            for (var j = 0; j < names.length; j++) {
              caches.delete(names[j]);
            }
          }).catch(function() {});
        }
      }

      function showBootError(msg) {
        var root = document.getElementById('root');
        if (root && (!root.firstElementChild || root.querySelector('#initial-loader'))) {
          console.error('Boot recovery triggered:', msg);
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center;">' +
            '<div style="max-width:440px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
            '<div style="width:48px;height:48px;border-radius:12px;background:rgba(239,68,68,0.15);color:#ef4444;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;font-weight:bold;">!</div>' +
            '<h2 style="font-size:18px;font-weight:bold;margin:0 0 8px;">PrecisionPOS Recovery</h2>' +
            '<p style="font-size:13px;color:#94a3b8;margin:0 0 16px;">App encountered an issue while loading. Clearing temporary cache will restore operation.</p>' +
            '<button onclick="localStorage.removeItem(\'kfh_inventory_clean_state_v1\');sessionStorage.clear();window.location.reload();" style="width:100%;padding:12px;background:#dc2626;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;margin-bottom:8px;">Reset Cache & Reload</button>' +
            '<button onclick="window.location.reload();" style="width:100%;padding:10px;background:#334155;color:#f8fafc;border:none;border-radius:10px;font-size:13px;cursor:pointer;">Reload App</button>' +
            '</div></div>';
        }
      }

      // Capture fatal module script loading errors specifically
      window.addEventListener('error', function(event) {
        if (event.error) {
          console.error('Window error:', event.error);
        }
      });
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
